name: Release Examples

# Builds every example for the browser, takes a screenshot of each one from its
# scripted run, and attaches the bundle to the release as asw-examples.zip, so
# the docs site can embed playable examples.

on:
  release:
    types: [published]

jobs:
  examples:
    name: Package Examples
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EM_VERSION: 6.0.10
      EM_CACHE_FOLDER: "emsdk-cache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: ${{ env.EM_VERSION }}-${{ runner.os }}

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      - name: Download ports
        run: embuilder build harfbuzz

      - name: Run CMake (Release & Examples)
        run: emcmake cmake --preset release -DASW_BUILD_EXAMPLES=ON

      - name: Make
        run: cmake --build --preset release

      - name: Package examples
        run: examples/web/package.sh build/release/bin asw-examples

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r asw-examples.zip asw-examples
          gh release upload "${{ github.event.release.tag_name }}" asw-examples.zip \
            --repo "${{ github.repository }}" --clobber
